; FNV Multithreaded AI (EXPERIMENTAL) -- goes next to MultithreadedAI.dll in Data\NVSE\Plugins
; Log: MultithreadedAI.log in the game folder (replaced each launch). Send it with any crash report.

[Main]
; 1 = on when the game starts, 0 = off
Enabled = 1
; 1 = the Scroll Lock key switches it on/off while playing (to compare), 0 = no key
ScrollLockToggle = 1
; helper threads for the detection checks. 0 = automatic: your CPU's logical cores minus 3, at most 8
; (a CPU with 3 or fewer threads gets none and the plugin stays idle)
Threads = 0

[Advanced]
; a lone NPC's detection run with fewer checks than this stays one by one (not worth waking the helpers)
MinChecks = 12
; diagnostic: 1 = the checks themselves run one by one again (no speed-up), only the preparation uses the helpers
SerialChecks = 0
; how often the log gets a line of numbers while it works, in seconds. 0 = never
LogSummarySeconds = 10
; diagnostic: 1 = no helper threads at all; the batches run on the AI thread alone (no speed-up). For crash hunting.
NoHelpers = 0
; diagnostic: 1 = line-of-sight ray casts run one at a time (less speed-up). For crash hunting.
PickLock = 0
